name: Auto Setup and Build

on:
  workflow_dispatch:

jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/25.2.9519653

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Auto-create missing files
      run: |
        # Создаем version.h для игры
        mkdir -p src/game
        cat << 'EOF' > src/game/version.h
        #ifndef GAME_VERSION_H
        #define GAME_VERSION_H
        #define GAME_RELEASE_VERSION_INTERNAL "0.4.0"
        #define TCLIENT_VERSION "0.4.0"
        #define BESTCLIENT_VERSION "0.4.0"
        #endif
        EOF
        
        # Создаем version.h для bestclient
        mkdir -p src/game/client/components/bestclient/
        cat << 'EOF' > src/game/client/components/bestclient/version.h
        #define BESTCLIENT_VERSION "0.4.0"
        EOF

        # Коммитим изменения
        git config user.name "GitHub Action Bot"
        git config user.email "actions@github.com"
        git add .
        git commit -m "Fix bestclient version file" || echo "No changes"
        git push

    - name: Setup Android SDK & NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

    - name: Smart Patcher (Auto-fix for Android)
      run: |
        echo "Патчим CMakeLists.txt..."
        # Убираем линковку виндовых библиотек
        sed -i 's/ws2_32//g; s/winmm//g; s/gdi32//g; s/opengl32//g; s/iphlpapi//g; s/advapi32//g; s/user32//g' CMakeLists.txt
        
        echo "Патчим windows.h и системные вызовы..."
        find src -type f \( -name "*.cpp" -o -name "*.h" \) | xargs sed -i 's/#include <windows.h>/#ifdef _WIN32\n#include <windows.h>\n#endif/g' || true
        find src -type f \( -name "*.cpp" -o -name "*.h" \) | xargs sed -i 's/#include <winsock2.h>/#ifdef _WIN32\n#include <winsock2.h>\n#else\n#include <sys\/socket.h>\n#include <netinet\/in.h>\n#include <arpa\/inet.h>\n#include <unistd.h>\n#define closesocket close\n#define SOCKET int\n#define INVALID_SOCKET -1\n#define SOCKET_ERROR -1\n#endif/g' || true
        find src -type f \( -name "*.cpp" -o -name "*.h" \) | xargs sed -i 's/#include <process.h>/#ifdef _WIN32\n#include <process.h>\n#else\n#include <pthread.h>\n#endif/g' || true

    - name: Configure CMake
      run: |
        mkdir build_android
        cd build_android
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release ..

    - name: Build
      run: |
        cd build_android
        make -j$(nproc) || true

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: PastaClient-Binary
        path: build_android/
